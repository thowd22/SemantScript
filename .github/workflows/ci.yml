# Lint, tests, a fresh-clone install and the example builds on every push and
# pull request. docs/CONTRIBUTING.md#continuous-integration describes the jobs
# and records their measured wall times.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request cancels its run still in progress;
# every commit on main keeps its own complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  node:
    name: Node lint, build and tests
    env:
      # onnxruntime-node bundles its CPU binaries; skip its CUDA download.
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The cli and refund benchmark tests start python3 with fixture drivers.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      # Build before lint: type-aware lint rules read the workspaces' dist/ types.
      - run: npm run build
      - run: npm run lint:node
      # Every workspace's node --test suite; compiler/test/docs-examples.test.mjs
      # compiles the TypeScript examples in docs/.
      - run: npm run test:node
      - name: Prettier over the docs
        run: npx --yes prettier@3.9.9 --check docs README.md

  python:
    name: Python lint and tests (${{ matrix.extras }})
    env:
      # onnxruntime-node bundles its CPU binaries; skip its CUDA download.
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Without the training extra: proves the torch-free install works and
          # that every test needing PyTorch or ONNX skips cleanly.
          - extras: dev
          # With the training extra on CPU-only PyTorch: every test that runs
          # without a GPU, a teacher or a live model server.
          - extras: dev,training
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install '.[${{ matrix.extras }}]' into .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          if [[ "${{ matrix.extras }}" == *training* ]]; then
            # The CPU build of the pinned torch (pyproject.toml): no CUDA wheels.
            torch=$(grep -o '"torch==[^"]*"' pyproject.toml | tr -d '"')
            .venv/bin/python -m pip install "$torch" --index-url https://download.pytorch.org/whl/cpu
          fi
          .venv/bin/python -m pip install -e '.[${{ matrix.extras }}]'
      - run: npm run lint:python
      # Some trainer tests drive runtime/dist and cli/dist.
      - run: npm ci
      - run: npm run build
      - run: npm run test:python
      # docs/environment.md: every Python-side doctor check passes on the CPU
      # install (the device is a warning there, not a failure); no teacher.
      - name: semantscript doctor against .venv
        if: contains(matrix.extras, 'training')
        run: node cli/bin/semantscript.js doctor --python .venv/bin/python --no-teacher

  doctor-platforms:
    # docs/environment.md records these runs: native Windows and macOS have no
    # local machine in this project, so the doctor checks run here on each push.
    name: semantscript doctor on ${{ matrix.os }}
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install '.[training]' into .venv (CPU PyTorch)
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then venv_python=.venv/Scripts/python.exe; else venv_python=.venv/bin/python; fi
          "$venv_python" -m pip install --upgrade pip
          torch=$(grep -o '"torch==[^"]*"' pyproject.toml | tr -d '"')
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$venv_python" -m pip install "$torch" --index-url https://download.pytorch.org/whl/cpu
          else
            "$venv_python" -m pip install "$torch"
          fi
          "$venv_python" -m pip install -e '.[training]'
      # Default interpreter first: with nothing activated the CLI uses the
      # runner's bare python (python on Windows, python3 elsewhere), so the
      # trainer packages are missing and doctor must say which interpreter
      # holds them. Its exit status is 1 by design; the output is the record.
      - name: semantscript doctor with the default interpreter
        run: |
          status=0
          node cli/bin/semantscript.js doctor --no-teacher > doctor-default.txt 2>&1 || status=$?
          cat doctor-default.txt
          test "$status" = 1 || { echo "expected exit 1, got $status"; exit 1; }
          grep -q "SEMANTSCRIPT_PYTHON environment variable to .venv" doctor-default.txt
      # Activated venv: the default interpreter is now the venv's, and every
      # check must pass (the CPU device is a warning).
      - name: semantscript doctor in the activated .venv
        run: |
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          node cli/bin/semantscript.js doctor --no-teacher
      - name: semantscript doctor --runtime
        run: node cli/bin/semantscript.js doctor --runtime
      # Native Windows shells: doctor under PowerShell, and the Windows fix
      # lines (PowerShell and cmd forms) run in the real shells, since Git
      # Bash above cannot show that they set the variables.
      - name: semantscript doctor in PowerShell, Windows fix lines in PowerShell and cmd
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          node cli/bin/semantscript.js doctor --no-teacher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest
          $env:PYTHONPATH = "trainer/src;model/src"
          python -m pytest -q -rs trainer/tests/test_doctor.py -k windows_fix_lines

  fresh-install:
    name: Fresh clone, examples and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # No npm cache and no install flags: this job measures a first install as
      # a new user sees it (including onnxruntime-node's CUDA download on x64).
      # setup-node@v5 caches npm by itself when package.json names a
      # packageManager, so the cache is turned off explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install and build the workspace (docs/CONTRIBUTING.md)
        run: |
          npm install
          npm run build
      - name: Express example (examples/express-app/README.md)
        working-directory: examples/express-app
        run: |
          npm install
          npm run build
          npm test
      - name: Refund service example (examples/refund-service/README.md)
        working-directory: examples/refund-service
        run: |
          npm install
          npm run build
          npm test
      - name: Fixture artifact for the image
        working-directory: examples/express-app
        run: npm run fixture-artifact
      # The tutorial and the example READMEs call the CLI as `npx semantscript`
      # from the example directory; this fails if npm did not link the bin.
      # `doctor --runtime` fails if the native bindings did not load after a
      # first install (this job has no trainer Python environment).
      - name: CLI through npx (docs/tutorial-refund-decision.md)
        working-directory: examples/express-app
        run: |
          npx --no-install semantscript --help
          npx --no-install semantscript doctor --runtime
          npx --no-install semantscript run dist/refunds.sem.js --call decideRefund \
            --input '[{"tier":"standard","priorRefunds":1},{"total":88.5,"ageDays":12,"status":"paid"}]'
      - name: Build the Express Docker image
        run: docker build -f examples/express-app/deploy/Dockerfile -t ticket-api .
      - name: Smoke-run the image
        run: |
          docker run -d --name ticket-api -p 3000:3000 ticket-api
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null -X POST localhost:3000/tickets \
                -H 'content-type: application/json' -d '{"subject":"s","body":"b"}'; then
              break
            fi
            sleep 1
          done
          ticket=$(curl -fsS -X POST localhost:3000/tickets \
            -H 'content-type: application/json' \
            -d '{"subject":"Checkout is down","body":"Every customer sees a 500."}')
          echo "POST /tickets -> $ticket"
          echo "$ticket" | grep -q '"priority":"urgent"'
          refund=$(curl -fsS -X POST localhost:3000/refunds/o1)
          echo "POST /refunds/o1 -> $refund"
          echo "$refund" | grep -q '"committed":false'
          docker image ls ticket-api --format 'image size {{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs ticket-api || true

  package:
    # docs/deploy.md: `semantscript package` writes the deployable directory;
    # this job derives an int8 release from the fixture artifact, promotes it,
    # then builds the Express example's image from the bundle alone and
    # invokes its serverless handler, both on that int8 release.
    name: releases derive --int8, semantscript package, Docker image and Lambda handler from the bundle
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The int8 derivation runs in the trainer: CPU PyTorch and the training extra.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install '.[training]' into .venv (CPU PyTorch)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          torch=$(grep -o '"torch==[^"]*"' pyproject.toml | tr -d '"')
          .venv/bin/python -m pip install "$torch" --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -e '.[training]'
      - run: npm ci
      - run: npm run build
      # --quantizable: the fixture encoder with a constant MatMul, plus the
      # fixture training datasets the derivation verifies on in .semantscript/cache.
      - name: Build the Express example with the quantizable fixture artifact
        working-directory: examples/express-app
        run: |
          npm install
          npm run build
          npm run fixture-artifact -- --quantizable
      # The strict default gate: no decision may change. --promote points
      # current.json at the int8 release, so every step below runs on it.
      - name: semantscript releases derive --int8 --promote
        working-directory: examples/express-app
        run: |
          npx --no-install semantscript releases derive --int8 --promote --python ../../.venv/bin/python
          shown=$(npx --no-install semantscript releases show "$(node -p 'require("./.semantscript/artifact/current.json").manifestSha256')")
          echo "$shown"
          grep -q '^derived      int8-dynamic from sha256-' <<<"$shown"
      # Must fit AWS Lambda's 250 MB unzipped limit: exit 1 otherwise.
      - name: semantscript package --target lambda-zip
        working-directory: examples/express-app
        run: npx --no-install semantscript package --include deploy/lambda.mjs --target lambda-zip
      - name: The bundle carries the int8 release
        working-directory: examples/express-app/.semantscript/package
        run: grep -rlq '"int8-dynamic"' --include=manifest.json .
      - name: Invoke the packaged Lambda handler once
        working-directory: examples/express-app/.semantscript/package
        run: |
          node --input-type=module -e '
            const { handler } = await import("./deploy/lambda.mjs");
            const response = await handler({
              body: JSON.stringify({ subject: "Checkout is down", body: "Every customer sees a 500." }),
            });
            console.log("handler ->", JSON.stringify(response));
            // The loaded runtime keeps its inference worker alive; exit explicitly.
            process.exit(response.statusCode === 201 && JSON.parse(response.body).priority === "urgent" ? 0 : 1);
          '
      - name: Build the image from the bundle
        working-directory: examples/express-app
        run: docker build -f deploy/Dockerfile.package -t ticket-api-package .semantscript/package
      - name: Run the image and send one request
        run: |
          docker run -d --name ticket-api-package -p 3000:3000 ticket-api-package
          # Wait until the server accepts connections (any HTTP status), then
          # send the one POST /tickets.
          for attempt in $(seq 1 60); do
            if curl -sS -o /dev/null localhost:3000/ 2>/dev/null; then break; fi
            sleep 1
          done
          ticket=$(curl -fsS -X POST localhost:3000/tickets \
            -H 'content-type: application/json' \
            -d '{"subject":"Checkout is down","body":"Every customer sees a 500."}')
          echo "POST /tickets -> $ticket"
          echo "$ticket" | grep -q '"priority":"urgent"'
          docker image ls ticket-api-package --format 'image size {{.Size}}'
      - name: Container logs
        if: always()
        run: docker logs ticket-api-package || true
